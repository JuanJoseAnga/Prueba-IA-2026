[project]
name = "bank-onboarding-orchestrator"
version = "0.1.0"
description = "Ejemplo de onboarding multiagente con arquitectura hexagonal"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.12,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "groq>=0.31,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

